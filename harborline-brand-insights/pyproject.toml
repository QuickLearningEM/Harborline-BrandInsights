[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brand-insights"
version = "0.1.0"
description = "Brand perception and segment responsiveness analytics for Harborline Home & Living"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.1",
  "pandas>=2.1",
  "numpy>=1.26",
  "pydantic-settings>=2.2",
  "argon2-cffi>=23.1",
  "requests>=2.31",
]

[project.optional-dependencies]
snowflake = ["snowflake-connector-python[pandas]>=3.7"]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
brand-insights = "brand_insights.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
brand_insights = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]
